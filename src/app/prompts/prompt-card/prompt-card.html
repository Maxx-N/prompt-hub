<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="mb-0">{{ prompt().title }}</h3>
      <div class="text-sm text-color-secondary">@{{ prompt().author.username }}</div>
    </div>
    <div class="flex gap-2">
      @if (canEdit()) {
        <p-button
          icon="pi pi-pencil"
          size="small"
          [text]="true"
          [routerLink]="[prompt().id, 'edit']"
        />
      }
      <p-button icon="pi pi-copy" size="small" [text]="true" (onClick)="copyToClipboard()" />
    </div>
  </div>
  <textarea pTextarea readonly class="w-full mb-2" rows="8">{{ prompt().content }}</textarea>
  <div class="flex justify-content-between">
    <p-tag [value]="prompt().category.name" severity="secondary" />
    <div class="flex gap-2 align-items-center">
      <p-button
        icon="pi pi-thumbs-up"
        size="small"
        [severity]="userVote() === 'up' ? 'primary' : 'secondary'"
        (onClick)="upvote()"
      />
      <span>{{ score() }}</span>
      <p-button
        icon="pi pi-thumbs-down"
        size="small"
        [severity]="userVote() === 'down' ? 'primary' : 'secondary'"
        (onClick)="downvote()"
      />
    </div>
  </div>
</p-card>
