<p-card>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="title">Title</label>
      <input id="title" type="text" pInputText class="w-full" formControlName="title" />
    </div>
    <div class="field">
      <label for="content">Content</label>
      <textarea
        id="content"
        type="text"
        pTextarea
        class="w-full"
        formControlName="content"
      ></textarea>
    </div>
    <div class="field">
      <label for="category">Category</label>
      <p-select
        inputId="category"
        type="text"
        class="w-full"
        [options]="categories()"
        optionValue="id"
        optionLabel="name"
        formControlName="categoryId"
      />
    </div>
    <div class="flex justify-content-end gap-2">
      <p-button label="Annuler" severity="secondary" routerLink="/" />
      <p-button label="Créer" type="submit" />
    </div>
  </form>
</p-card>
