<p-card [header]="mode() === 'login' ? 'Connexion' : 'Inscription'">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label for="username">Nom d'utilisateur</label
      ><input class="w-full" pInputText id="username" type="text" formControlName="username" />
      <small class="invalid-feedback">Le nom d'utilisateur est requis</small>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label
      ><p-password
        class="w-full"
        inputStyleClass="w-full"
        inputId="password"
        formControlName="password"
      />
      <small class="invalid-feedback">Le mot de passe est requis (min 4 caractères)</small>
    </div>
    <div class="flex gap-2 justify-content-end">
      <p-button
        severity="secondary"
        (onClick)="toggleMode()"
        [label]="mode() === 'login' ? 'Créer un compte' : 'Se connecter'"
      />
      <p-button type="submit" [label]="mode() === 'login' ? 'Se connecter' : 'Créer un compte'" />
    </div>
  </form>
</p-card>
