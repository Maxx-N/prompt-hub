<header class="navbar-shadow p-3 mb-4">
  <div class="container flex justify-content-between align-items-center">
    <a class="navbar-logo flex gap-2 align-items-center" routerLink="/">
      <img ngSrc="logo-prompt-hub.png" alt="logo" width="36" height="36" />
      Prompt Hub
    </a>
    <div class="flex align-items-center gap-2">
      @if (authService.currentUser(); as currentUser) {
        <span class="text-sm text-color-secondary">{{ currentUser.username }}</span>
        <p-button
          label="Déconnexion"
          size="small"
          severity="secondary"
          [loading]="loggingOut()"
          (onClick)="logout()"
        />
      } @else {
        <p-button label="Connexion" size="small" severity="secondary" routerLink="/auth" />
      }
      <p-button
        [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        size="small"
        severity="secondary"
        (onClick)="isDark.update((isDark) => !isDark)"
      />
      <p-button label="Ajouter" icon="pi pi-plus" size="small" routerLink="/prompts/create" />
    </div>
  </div>
</header>
